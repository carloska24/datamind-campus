size:24,node:[[`path`,{d:`M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z`,key:`uqj9uw`}],[`path`,{d:`M16 9a5 5 0 0 1 0 6`,key:`1q6k2b`}],[`path`,{d:`M19.364 18.364a9 9 0 0 0 0-12.728`,key:`ijwkga`}]]};Et.node;var Dt=E(Et),Ot={name:`x`,size:24,node:[[`path`,{d:`M18 6 6 18`,key:`1bl5f8`}],[`path`,{d:`m6 6 12 12`,key:`d8bk6v`}]]};Ot.node;var kt=E(Ot),At=g(),jt=JSON.parse(`[{"title":"Da pergunta à decisão","pages":"13–19","idea":"Ciência de dados começa com uma pergunta útil.","explain":"Dados são registros. Informação é um dado colocado em contexto. Conhecimento é uma interpretação sustentada por evidências. Decisão é a ação que você toma e depois avalia. Data Science combina domínio do processo, estatística e programação. Um gráfico bonito sozinho não fecha esse ciclo.","example":"Na AOI: “35 apontamentos” é um dado. “35 em 1.000 placas, concentrados no componente X” é informação. Confirmar se são defeitos reais e investigar o processo gera conhecimento. Ajustar uma condição e medir o resultado fecha a decisão. Exemplo complementar, não retirado do slide.","question":"Por que começar por “vou usar IA” pode atrapalhar?","answer":"Porque ainda faltam problema, métrica, dados e critério de sucesso. Comece por “quero reduzir retrabalho confirmado por lote”, por exemplo.","code":"","id":0,"category":"Fundamentos","minutes":8},{"title":"Onde os dados nascem","pages":"13–16","idea":"Sua fábrica já produz dados; falta conectá-los com contexto.","explain":"Fontes incluem sensores, máquinas, produção, manutenção, qualidade, energia e sistemas de gestão. Dados estruturados têm campos definidos, como uma tabela; semiestruturados têm organização flexível, como JSON; não estruturados incluem imagens e textos livres. Para integrar fontes, preserve data/hora, máquina, produto, lote e unidade.","example":"SPI: volume de pasta por pad. AOI: imagem e classificação. SMT: rejeições de pickup. Seletiva: alarmes e parâmetros. ERP: ordem e quantidade. Uma ligação por lote e horário permite investigar relações; juntar só pelo dia pode misturar processos diferentes.","question":"Qual problema ocorre ao juntar AOI e SPI sem identificar a placa?","answer":"Você pode associar medições de placas diferentes e descobrir um padrão que não existe. A identidade e o instante de coleta fazem parte da qualidade do dado.","code":"","id":1,"category":"Fundamentos","minutes":10},{"title":"Big Data, mineração e aprendizado","pages":"9–24","idea":"São conceitos relacionados, com papéis diferentes.","explain":"Data Science é o trabalho amplo de formular, analisar e avaliar. Data Mining busca padrões nos dados e é uma etapa do KDD. Machine Learning ajusta modelos a exemplos para generalizar a novos casos. Big Data trata desafios de escala, velocidade e diversidade; como complemento didático, os cinco Vs são volume, velocidade, variedade, veracidade e valor. Uma planilha pequena pode gerar um excelente estudo sem ser Big Data.","example":"Classificação: prever categoria de defeito. Regressão: estimar consumo. Agrupamento: reunir perfis de máquina semelhantes sem rótulos. Associação: investigar eventos que aparecem juntos. Nenhuma dessas tarefas dispensa validação.","question":"O exercício de cinco motores exige uma plataforma de Big Data?","answer":"Não. Pandas e raciocínio estatístico já permitem estudar esse conjunto pequeno. A ferramenta deve acompanhar o problema e a escala.","code":"","id":2,"category":"Fundamentos","minutes":12},{"title":"Profissionais e ferramentas","pages":"20; 32–33","idea":"Entenda o papel antes de escolher a biblioteca.","explain":"Engenharia de dados organiza coleta, integração e disponibilidade. Análise de dados investiga indicadores e comunica resultados. Ciência de dados desenvolve e avalia análises e modelos. Na prática há sobreposição. Python é a linguagem; Jupyter é um ambiente de exploração; Pandas trabalha com tabelas; NumPy com arrays; Matplotlib, Seaborn e Plotly com visualização; scikit-learn com aprendizado de máquina.","example":"Para começar nesta aula: Python + Pandas. Depois, um gráfico de dispersão pode apoiar a interpretação. Você não precisa dominar todas as bibliotecas do slide para resolver os exercícios.","question":"Quem garante que o dado da máquina chegue confiável à análise?","answer":"A engenharia de dados tem um papel central, em parceria com produção, manutenção e qualidade. O cientista não deve assumir que o registro recebido já está correto.","code":"","id":3,"category":"Fundamentos","minutes":8},{"title":"KDD: seleção","pages":"25–27","idea":"Escolha os registros que respondem à pergunta.","explain":"KDD significa descoberta de conhecimento em bases de dados. A sequência da aula é seleção, pré-processamento, transformação, mineração e interpretação/avaliação. É iterativa: um problema na avaliação pode exigir voltar ao início. Na seleção, defina período, população, campos e unidade de análise.","example":"Pergunta: “a temperatura se associa à taxa de defeitos?” Selecione temperatura, produção, defeitos, produto, máquina, lote e horário. Defina se cada linha representa lote, turno ou placa; não misture níveis sem critério.","question":"Posso selecionar apenas lotes que deram defeito?","answer":"Isso exclui os casos sem defeito e distorce a comparação. Inclua registros representativos da população que você deseja estudar.","code":"","id":4,"category":"KDD","minutes":8},{"title":"KDD: pré-processamento","pages":"28","idea":"Limpar é investigar o significado do erro.","explain":"Verifique ausências, duplicatas, tipos, unidades e valores impossíveis. NaN geralmente representa ausência em dados numéricos; zero pode ser uma medição válida. Um valor extremo pode ser falha de registro ou evento real. Dados não estruturados não são inválidos por serem imagens ou textos. Não preencha tudo com zero nem exclua linhas sem entender o motivo.","example":"Uma temperatura vazia após manutenção pode indicar sensor desconectado. Trocar por zero inventa uma temperatura. Registre a ausência, investigue sua causa e escolha uma estratégia conforme o objetivo.","question":"Por que apagar toda linha com valor ausente pode gerar viés?","answer":"Se a ausência ocorre mais em situações de falha, você remove justamente os casos importantes. Compare o padrão das ausências antes de decidir.","code":"df.info()\\ndf.isna().sum()\\ndf.duplicated().sum()","id":5,"category":"KDD","minutes":10},{"title":"KDD: transformação","pages":"29","idea":"Prepare as variáveis para a comparação e o método.","explain":"Transformar pode significar converter tipos, padronizar unidades, codificar categorias, agregar períodos ou criar indicadores. Normalização reescala valores e pode ajudar alguns algoritmos; não é uma obrigação para toda análise. Não confunda transformação com descoberta de padrões.","example":"Comparar 12 defeitos em 120 peças com 5 em 100 exige uma taxa. Se “defeitos” conta ocorrências e uma peça pode ter vários, o resultado é ocorrências por 100 peças, não percentual de peças defeituosas. A aula não esclarece essa definição.","question":"Qual é a taxa de 12 em 120?","answer":"10 por 100 peças. Só chame de 10% de peças defeituosas se cada peça for contada no máximo uma vez.","code":"df['taxa_defeitos'] = df['defeitos'] / df['producao'] * 100","id":6,"category":"KDD","minutes":10},{"title":"KDD: mineração e avaliação","pages":"30–31","idea":"Padrão encontrado não é conclusão pronta.","explain":"A mineração pode usar correlação, classificação, agrupamento e outros métodos. A avaliação pergunta se o padrão é consistente, útil e válido no contexto. Para modelos preditivos, separar dados de treino e avaliação ajuda a evitar resultados otimistas; séries temporais exigem cuidado com a ordem do tempo. Esses cuidados são aprofundamentos didáticos.","example":"Um alerta de parada deve ser avaliado por antecipação, falhas detectadas e falsos alarmes. Um modelo que dispara o tempo todo pode detectar falhas e ainda ser inútil na operação.","question":"O que fazer após encontrar uma correlação forte?","answer":"Investigar variáveis alternativas, verificar a qualidade do registro, coletar mais dados e avaliar a hipótese. Não alterar processo apenas pelo coeficiente.","code":"","id":7,"category":"KDD","minutes":12},{"title":"Pandas: ler a tabela","pages":"35–41","idea":"DataFrame é tabela; Series é uma coluna com índice.","explain":"Cada linha é uma observação e cada coluna é uma variável. O índice rotula linhas e não precisa ser um ID de negócio. df.shape é atributo, sem parênteses. head() mostra linhas; info() apresenta estrutura e retorna None; describe() resume valores numéricos por padrão. import pandas as pd cria o apelido pd.","example":"Na tabela da aula, produto é categoria; produção e defeitos são contagens; temperatura é medida numérica. A unidade da temperatura não aparece explícita na tabela; confirme antes de documentar um processo real.","question":"Qual diferença entre um e dois pares de colchetes?","answer":"df[\\"temperatura\\"] retorna Series; df[[\\"temperatura\\"]] retorna DataFrame com uma coluna.","code":"import pandas as pd\\ndf.head()\\ndf.shape\\ndf.info()\\ndf.describe()\\ndf['temperatura']\\ndf[['produto', 'temperatura']]","id":8,"category":"Pandas","minutes":15},{"title":"Pandas: filtrar e agrupar","pages":"42; 49–58","idea":"Cada comando responde a uma pergunta concreta.","explain":"Um filtro produz uma máscara booleana. Use & para combinar condições e coloque cada condição entre parênteses. sort_values organiza linhas. groupby reúne categorias para calcular medidas. mean é média; median é mediana; std mede dispersão. A média sozinha pode esconder diferenças entre produtos.","example":"Temperatura > 75 seleciona as duas linhas de Motor B. Isso já acende uma dúvida: a temperatura e o tipo de motor estão associados neste conjunto. Não há amostra suficiente para separar bem os efeitos.","question":"Qual a média de produção do Motor A?","answer":"(100 + 110) / 2 = 105. Motor B = 125; Motor C = 90.","code":"df[df['temperatura'] > 75]\\ndf[(df['temperatura'] > 75) & (df['defeitos'] > 10)]\\ndf.sort_values('temperatura', ascending=False)\\ndf.groupby('produto')['producao'].mean()\\ndf.groupby('produto').agg(\\n    producao=('producao','mean'),\\n    defeitos=('defeitos','mean'))","id":9,"category":"Pandas","minutes":18},{"title":"Laboratório 1: temperatura e defeitos","pages":"45–60","idea":"Há associação forte nesses cinco registros; a causa continua aberta.","explain":"Com os dados transcritos do slide: temperatura média 75,6; produção média 110; temperatura mínima 68 e máxima 85; defeitos médios 8,2. A correlação de Pearson entre temperatura e contagem de defeitos é 0.995051. Ela mede associação linear e não demonstra causalidade. Cinco registros são insuficientes para uma conclusão industrial robusta.","example":"Motor B concentra as maiores temperaturas e contagens. Produto e volume produzido podem explicar parte da relação. Como próximo estudo, compare taxas dentro do mesmo produto, amplie o período e controle máquina, lote e condições de medição.","question":"Qual frase é defensável: “temperatura causa defeitos” ou “nesta amostra variam juntas”?","answer":"Nesta amostra variam juntas. Para sustentar causalidade, precisamos de um desenho de investigação adequado e controle das explicações alternativas.","code":"df[['producao', 'defeitos', 'temperatura']].corr()\\ndf[['temperatura', 'taxa_defeitos']].corr()","id":10,"category":"Laboratórios","minutes":20},{"title":"Laboratório 2: produção e energia","pages":"61–62","idea":"Maior produção e melhor eficiência são perguntas diferentes.","explain":"Dados por turno: A = 1250 peças / 420 kWh; B = 1380 / 465; C = 1190 / 390; D = 1450 / 510; E = 1320 / 405. A razão produção/energia tem unidade peças/kWh. Considere produto, período e condições equivalentes para comparar máquinas na operação real.","example":"D produz mais: 1450 peças. C consome menos: 390 kWh. Produção média: 1318 peças/turno. Energia média: 438 kWh/turno. Ordem de produção: D, B, E, A, C. Eficiências: A 2,9762; B 2,9677; C 3,0513; D 2,8431; E 3,2593 peças/kWh. E é a melhor por essa métrica.","question":"Por que escolher D como mais eficiente seria um erro?","answer":"D tem maior produção absoluta, mas gasta mais energia por peça que E. A métrica precisa combinar o resultado e o recurso consumido.","code":"m['eficiencia'] = m['producao'] / m['energia']\\nm.sort_values('eficiencia', ascending=False)\\nm['producao'].mean()\\nm['energia'].mean()","id":11,"category":"Laboratórios","minutes":18},{"title":"Transferir para a sua rotina","pages":"Complemento aplicado","idea":"Transforme experiência industrial em perguntas verificáveis.","explain":"Escolha um problema pequeno. Defina indicador, unidade, período e critério de sucesso. Monte um dicionário de dados e registre a origem. Faça análise exploratória antes de tentar prever. Escreva conclusão separando observação, hipótese e próximo teste.","example":"Projeto: investigar rejeições de pickup. Campos sugeridos: máquina, programa, componente, feeder, nozzle, lote, horário, tentativas e rejeições. Indicador: rejeições/tentativas. Controle mudanças de setup e não use nome do operador como explicação automática de falha. Todos esses campos são sugestões, não dados da empresa.","question":"Qual seria seu primeiro entregável?","answer":"Uma tabela confiável, um dicionário de campos, uma análise descritiva e uma hipótese testável. Um modelo de IA pode vir depois, se houver necessidade e dados adequados.","code":"","id":12,"category":"Aplicação","minutes":15},{"title":"Como revisar esta aula","pages":"Roteiro sugerido","idea":"Aprender é conseguir explicar e fazer sem olhar.","explain":"Sessão 1, 30 min: módulos 1 a 4, explique os conceitos em voz alta. Sessão 2, 40 min: módulos 5 a 8, aplique o KDD a um caso. Sessão 3, 50 min: módulos 9 a 12, execute o notebook e tente os exercícios antes do gabarito. Sessão 4, 30 min: módulo 13, esboce um projeto industrial. Revise após 1, 3 e 7 dias; os intervalos são uma sugestão.","example":"Em cada revisão: escreva três coisas que lembra, uma dúvida e uma situação da fábrica em que o conceito ajudaria. Volte ao módulo quando não conseguir explicar com palavras próprias.","question":"Quando marcar um módulo como compreendido?","answer":"Quando você consegue explicar a ideia, resolver a pergunta e dar um exemplo novo sem consultar. O checkbox serve para autoavaliação, não certifica domínio.","code":"","id":13,"category":"Aplicação","minutes":8}]`),Mt={df:[{produto:`Motor A`,producao:100,defeitos:5,temperatura:70,taxa_defeitos:5},{produto:`Motor B`,producao:120,defeitos:12,temperatura:82,taxa_defeitos:10},{produto:`Motor A`,producao:110,defeitos:6,temperatura:73,taxa_defeitos:5.454545454545454},{produto:`Motor C`,producao:90,defeitos:3,temperatura:68,taxa_defeitos:3.3333333333333335},{produto:`Motor B`,producao:130,defeitos:15,temperatura:85,taxa_defeitos:11.538461538461538}],m:[{maquina:`A`,producao:1250,energia:420,eficiencia:2.9761904761904763},{maquina:`B`,producao:1380,energia:465,eficiencia:2.967741935483871},{maquina:`C`,producao:1190,energia:390,eficiencia:3.051282051282051},{maquina:`D`,producao:1450,energia:510,eficiencia:2.843137254901961},{maquina:`E`,producao:1320,energia:405,eficiencia:3.259259259259259}]},Nt=o((e=>{var t=Symbol.for(`react.transitional.element`),n=Symbol.for(`react.fragment`);function r(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}e.Fragment=n,e.jsx=r,e.jsxs=r})),M=o(((e,t)=>{t.exports=Nt()}))();function Pt({compact:e=!1}){let t=(0,T.useId)().replace(/:/g,``);return(0,M.jsxs)(`svg`,{viewBox:`0 0 620 420`,className:`factory-art ${e?`compact`:``}`,role:`img`,"aria-label":`Fábrica conectada: máquina, placa eletrônica
